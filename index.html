<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="dns-prefetch" href="//fonts.googleapis.com">
  <link rel="dns-prefetch" href="//fonts.gstatic.com">
  <link rel="preload" as="image" imagesrcset="/hero-320.avif 320w, /hero-480.avif 480w, /hero-640.avif 640w"
    imagesizes="(max-width: 480px) 480px, (max-width: 767px) 800px, 50vw" fetchpriority="high" type="image/avif" />
  <link rel="preload" as="image" imagesrcset="/hero2-320.avif 320w, /hero2-480.avif 480w, /hero2-640.avif 640w"
    imagesizes="(max-width: 480px) 480px, (max-width: 767px) 800px, 50vw" fetchpriority="high" type="image/avif" />

  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Outfit:wght@400;500;700&display=swap"
    media="print" onload="this.media='all'" />
  <noscript>
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Outfit:wght@400;500;700&display=swap" />
  </noscript>

  <meta name="description"
    content="WatchHouse serves modern coffee across distinctive Houses, with coffee beans, pods, subscriptions, locations and stories from the brand." />
  <link rel="canonical" href="https://watch-house-pi.vercel.app/" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="WatchHouse." />
  <meta property="og:description"
    content="Modern coffee across distinctive Houses, with beans, pods, subscriptions, locations and stories from WatchHouse." />
  <meta property="og:url" content="https://watch-house-pi.vercel.app/" />
  <meta property="og:image" content="https://watch-house-pi.vercel.app/hero-480.webp" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="WatchHouse." />
  <meta name="twitter:description"
    content="Modern coffee across distinctive Houses, with beans, pods, subscriptions, locations and stories from WatchHouse." />
  <meta name="twitter:image" content="https://watch-house-pi.vercel.app/hero-480.webp" />
  <meta name="theme-color" content="#F5EFEB" />
  <title>WatchHouse.</title>

  <!-- Critical CSS - Inlined for instant FCP/LCP -->
  <style>
    :root {
      --color-bg: #F5EFEB;
      --color-text: #1A1A1A;
      --font-serif: "Outfit", serif;
      --font-sans: "Inter", sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      background-color: var(--color-bg);
      color: var(--color-text);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* Skeleton Split Hero inside Root */
    .hero-pre {
      height: clamp(60vh, 85vh, 95vh);
      width: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    @media (min-width: 768px) {
      .hero-pre {
        flex-direction: row;
      }
    }

    .hero-pre-side {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: #DCD8D2;
      min-height: 300px;
    }

    @media (min-width: 768px) {
      .hero-pre-side {
        min-height: auto;
      }
    }

    .hero-pre-bg {
      position: absolute;
      top: -20px;
      left: -20px;
      right: -20px;
      bottom: -20px;
      transform: scale(1.1);
    }

    .hero-pre-zoomed {
      top: -25%;
      left: -25%;
      right: -25%;
      bottom: -25%;
    }

    .hero-pre-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    /* Scroll-reveal initial state - prevents FOUC when async CSS loads */
    .reveal, .reveal-left, .reveal-right, .reveal-scale {
      opacity: 0;
    }
    .reveal.revealed, .reveal-left.revealed, .reveal-right.revealed, .reveal-scale.revealed {
      opacity: 1;
    }

    /* Content-visibility for below-fold sections */
    .footer, .house-fav-section, .highlighted-houses-section,
    .point-of-origin-section, .press-section, .split-cards-section,
    .wh-home-wrapper {
      content-visibility: auto;
      contain-intrinsic-size: 1px 900px;
    }

    img { display: block; max-width: 100%; height: auto; }
    picture { display: contents; }
  </style>
</head>

<body>
  <div id="root">
    <!-- TopBar Skeleton for 0 CLS -->
    <div style="background-color: #1A1A1A; height: 35px; width: 100%;"></div>
    <!-- Header Skeleton for 0 CLS -->
    <div
      style="border-bottom: 1px solid rgba(0,0,0,0.05); padding: clamp(12px, 2vw, 20px) clamp(16px, 5vw, 40px); background-color: #F5EFEB; display: flex; align-items: center;">
      <div
        style="font-family: 'Outfit', serif; font-size: clamp(18px, 4vw, 24px); font-weight: 700; color: #1A1A1A; line-height: normal;">
        WatchHouse.</div>
    </div>

    <!-- EXACT replica of Hero.jsx Mobile DOM to avoid Hydration LCP trigger -->
    <div class="hero-pre">
      <div class="hero-pre-side">
        <picture class="hero-pre-bg">
          <source srcset="/hero-320.avif 320w, /hero-480.avif 480w, /hero-640.avif 640w"
            sizes="(max-width: 480px) 480px, (max-width: 767px) 800px, 50vw" type="image/avif" />
          <img src="/hero-480.webp" alt="" fetchpriority="high" loading="eager" decoding="async" class="hero-pre-img" />
        </picture>
      </div>
      <div class="hero-pre-side">
        <picture class="hero-pre-bg hero-pre-zoomed">
          <source srcset="/hero2-320.avif 320w, /hero2-480.avif 480w, /hero2-640.avif 640w"
            sizes="(max-width: 480px) 480px, (max-width: 767px) 800px, 50vw" type="image/avif" />
          <img src="/hero2-480.webp" alt="" fetchpriority="high" loading="eager" decoding="async"
            class="hero-pre-img" />
        </picture>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
