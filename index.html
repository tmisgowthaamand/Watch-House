  <!-- Critical CSS - Inlined for LCP optimization -->
  <style>
    :root {
      --color-bg: #F5EFEB;
      --color-text: #1A1A1A;
      --font-serif: "Outfit", serif;
      --font-sans: "Inter", sans-serif;
      --spacing-xs: clamp(8px, 1.5vw, 12px);
      --spacing-sm: clamp(12px, 2vw, 20px);
      --spacing-md: clamp(16px, 5vw, 40px);
      --spacing-lg: clamp(24px, 7vw, 60px);
      --spacing-xl: clamp(40px, 10vw, 100px);
      --text-xs: clamp(0.75rem, 1vw, 0.875rem);
      --text-sm: clamp(0.875rem, 1.5vw, 1rem);
      --text-base: clamp(0.95rem, 1.8vw, 1.125rem);
      --text-lg: clamp(1rem, 2.5vw, 1.4rem);
      --text-xl: clamp(1.2rem, 3vw, 2rem);
      --text-2xl: clamp(1.5rem, 4vw, 2.8rem);
      --text-3xl: clamp(1.8rem, 5vw, 3.5rem);
      --text-4xl: clamp(2rem, 6vw, 4.5rem);
      --container-padding: clamp(16px, 5vw, 40px);
      --mx: 0px;
      --my: 0px;
      --mx-slow: 0px;
      --my-slow: 0px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      background-color: var(--color-bg);
      color: var(--color-text);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    h1,
    h2,
    h3,
    h4,
    .serif-dot {
      font-family: var(--font-serif);
    }

    .serif-dot::after {
      content: '.';
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      background: none;
      border: none;
      cursor: pointer;
      color: inherit;
      font-family: inherit;
    }

    :focus-visible {
      outline: 2px solid currentColor;
      outline-offset: 3px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .container {
      max-width: 1440px;
      margin: 0 auto;
      padding: 0 var(--container-padding);
    }

    .section-padding {
      padding: clamp(60px, 10vw, 100px) 0;
    }
  </style>
</head>

<body>
  <div id="root">
    <picture style="display:block; width:100vw; height:clamp(60vh, 85vh, 95vh); overflow:hidden; background:#DCD8D2;">
      <source srcset="/hero-320.avif 320w, /hero-480.avif 480w, /hero-640.avif 640w"
        sizes="(max-width: 767px) 100vw, 50vw" type="image/avif" />
      <img src="/hero-640.avif" alt="" fetchpriority="high" loading="eager" decoding="async"
        style="width:100%; height:100%; object-fit:cover;" />
    </picture>
  </div>
  <script type="module" src="/src/main.jsx" defer></script>
</body>

</html>
